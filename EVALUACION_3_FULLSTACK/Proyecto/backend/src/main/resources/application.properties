spring.application.name=vet-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/dinobox}
spring.datasource.username=${DB_USER:dinobox}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seller.password=${SELLER_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:900}
app.jwt.refresh-seconds=${JWT_REFRESH_SECONDS:604800}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.origins=${AUTH_ORIGINS:${app.cors.origins},http://localhost:8080,http://127.0.0.1:8080}
app.seed.enabled=${SEED_ENABLED:true}
server.error.include-message=never
