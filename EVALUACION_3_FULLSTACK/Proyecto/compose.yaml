services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dinobox
      MYSQL_USER: dinobox
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dinobox_mysql:/var/lib/mysql
volumes:
  dinobox_mysql: {}
